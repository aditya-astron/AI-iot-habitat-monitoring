[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitat-monitor"
version = "0.2.0"
description = "Habitat / analog-mission environmental monitoring: ingest, detect, optimize."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aditya Pandya" }]
dependencies = [
    "fastapi==0.115.8",
    "uvicorn==0.34.0",
    "pydantic==2.10.6",
    "pydantic-settings==2.7.1",
    "numpy==2.2.2",
    "scikit-learn==1.6.1",
    "pyserial==3.5",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "ruff==0.9.6",
]

[project.scripts]
habitat-monitor = "habitat_monitor.cli:main"

[tool.setuptools.packages.find]
include = ["habitat_monitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "UP"]
ignore = ["E501", "E402"]
